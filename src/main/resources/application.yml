spring:
  application:
    name: mindcare-agent

  datasource:
    url: jdbc:h2:mem:mindcare
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b
      embedding:
        model: bge-m3

    vectorstore:
      chroma:
        client:
          host: http://localhost:8000
        collection-name: psychological_knowledge

server:
  port: 8080

# Emotion fusion weights (visual=0.5, voice=0.4, text=0.1)
emotion:
  fusion:
    visual-weight: 0.5
    voice-weight: 0.4
    text-weight: 0.1
  risk:
    high-threshold: 0.8
    medium-threshold: 0.6
    low-threshold: 0.4

# External service endpoints
mcp:
  email:
    smtp-host: smtp.example.com
    smtp-port: 587
    username: alert@mindcare.com
    password: placeholder
    from: alert@mindcare.com
  excel:
    output-dir: ./data/reports

whisper:
  api-url: http://localhost:11434/api/generate

mediapipe:
  endpoint: http://localhost:8001/analyze