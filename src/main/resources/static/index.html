<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智心AI - 校园心理健康助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8edf5 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    width: 480px;
    max-width: 100%;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 24px;
    text-align: center;
  }
  .header h1 { font-size: 22px; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.85; }

  /* Login */
  .login-box {
    padding: 24px;
    border-bottom: 1px solid #eee;
    background: #fafbfc;
  }
  .login-box.hidden { display: none; }
  .login-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .login-row input {
    flex: 1; min-width: 80px; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 13px; outline: none;
  }
  .login-row input:focus { border-color: #667eea; }
  .login-btn {
    padding: 8px 20px; background: #667eea; color: white; border: none;
    border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .login-btn:hover { background: #5a6fd6; }
  .login-status { font-size: 12px; color: #666; margin-top: 6px; }

  /* Chat */
  .chat-box { padding: 16px; }
  .messages {
    height: 420px; overflow-y: auto; padding: 8px 4px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages:empty::after {
    content: '发送一条消息开始对话吧 💬';
    display: block; text-align: center; color: #aaa;
    padding: 60px 0; font-size: 14px;
  }
  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 14px;
    line-height: 1.6; font-size: 14px; word-break: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    background: #667eea; color: white; align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    background: #f0f2f5; color: #333; align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.ai .emotion-badge {
    display: inline-block; font-size: 11px; padding: 2px 10px;
    border-radius: 10px; margin-bottom: 6px; font-weight: 500;
  }
  .badge-NONE { background: #e8f5e9; color: #2e7d32; }
  .badge-LOW { background: #fff3e0; color: #e65100; }
  .badge-MEDIUM { background: #fff8e1; color: #f57f17; }
  .badge-HIGH { background: #ffebee; color: #c62828; }
  .msg.ai .typing { display: inline-block; }
  .msg.ai .cursor {
    display: inline-block; width: 2px; height: 16px;
    background: #667eea; margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .input-area {
    display: flex; gap: 8px; padding: 12px 0 4px;
    border-top: 1px solid #eee; margin-top: 8px;
  }
  .input-area input {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: #667eea; }
  .input-area input:disabled { background: #f5f5f5; }
  .send-btn {
    padding: 10px 20px; background: #667eea; color: white; border: none;
    border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: background 0.2s;
  }
  .send-btn:hover:not(:disabled) { background: #5a6fd6; }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; }

  .risk-bar {
    padding: 8px 16px; font-size: 12px; display: flex; gap: 16px;
    border-top: 1px solid #eee; background: #fafbfc;
  }
  .risk-bar.hidden { display: none; }
  .risk-bar .item { display: flex; align-items: center; gap: 4px; }
  .risk-bar .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%;
  }
  .dot-NONE { background: #4caf50; }
  .dot-LOW { background: #ff9800; }
  .dot-MEDIUM { background: #ffc107; }
  .dot-HIGH { background: #f44336; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌿 智心AI</h1>
    <p>校园心理健康助手 · 温暖陪伴</p>
  </div>

  <div class="login-box" id="loginBox">
    <div class="login-row">
      <input type="text" id="usernameInput" placeholder="用户名" value="admin">
      <input type="password" id="passwordInput" placeholder="密码" value="admin123">
      <button class="login-btn" id="loginBtn">登录</button>
    </div>
    <div class="login-status" id="loginStatus">请输入管理员账号密码登录</div>
  </div>

  <div class="chat-box">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="说说你的困扰..." disabled>
      <button class="send-btn" id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <div class="risk-bar hidden" id="riskBar">
    <span class="item">情绪: <strong id="emotionLabel">-</strong></span>
    <span class="item">
      <span class="dot dot-NONE" id="riskDot"></span>
      风险: <strong id="riskLevel">NONE</strong>
    </span>
  </div>
</div>

<script>
let authToken = '';
let isStreaming = false;

// ---- Login ----
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  authToken = btoa(username + ':' + password);
  document.getElementById('loginStatus').textContent = '验证中...';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic ' + authToken
      },
      body: JSON.stringify({ text: 'test', userId: 1 })
    });
    if (res.ok) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('msgInput').focus();
      addMessage('你好！我是智心AI，你的校园心理健康助手。有什么困扰可以随时跟我说，我会在这里陪着你。', 'ai');
    } else {
      document.getElementById('loginStatus').textContent = '登录失败，请检查用户名和密码';
    }
  } catch (e) {
    document.getElementById('loginStatus').textContent = '连接失败: ' + e.message;
  }
}

// ---- Chat ----
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  addMessage(text, 'user');
  isStreaming = true;
  setControlsDisabled(true);

  const aiMsgEl = addMessage('', 'ai');
  const contentDiv = aiMsgEl.querySelector('.typing');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  contentDiv.appendChild(cursor);

  try {
    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic ' + authToken
      },
      body: JSON.stringify({ text, userId: 1 })
    });

    if (!response.ok) {
      contentDiv.textContent = '请求失败: ' + response.status;
      cursor.remove();
      isStreaming = false;
      setControlsDisabled(false);
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';
    let emotionData = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n');
      buffer = parts.pop() || '';

      for (const line of parts) {
        const trimmed = line.trim();
        if (trimmed.startsWith('event:')) {
          currentEvent = trimmed.slice(6).trim();
        } else if (trimmed.startsWith('data:')) {
          const data = trimmed.slice(5);
          if (currentEvent === 'message') {
            // Remove cursor, append text
            cursor.remove();
            contentDiv.textContent += data;
            scrollToBottom();
          } else if (currentEvent === 'emotion') {
            try { emotionData = JSON.parse(data); } catch(e) {}
          } else if (currentEvent === 'end') {
            // Done
          }
        }
      }
    }

    cursor.remove();

    // Update risk bar
    if (emotionData) {
      document.getElementById('emotionLabel').textContent = emotionData.label;
      document.getElementById('riskLevel').textContent = emotionData.risk;
      const dot = document.getElementById('riskDot');
      dot.className = 'dot dot-' + emotionData.risk;
      document.getElementById('riskBar').classList.remove('hidden');
    }

  } catch (e) {
    const cursor = aiMsgEl.querySelector('.cursor');
    if (cursor) cursor.remove();
    aiMsgEl.querySelector('.typing').textContent = '连接出错: ' + e.message;
  }

  isStreaming = false;
  setControlsDisabled(false);
  document.getElementById('msgInput').focus();
}

function addMessage(text, role) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  if (role === 'ai') {
    if (text) {
      div.innerHTML = '<span class="typing">' + escapeHtml(text) + '</span>';
    } else {
      div.innerHTML = '<span class="typing"></span>';
    }
  } else {
    div.textContent = text;
  }

  container.appendChild(div);
  scrollToBottom();
  return div;
}

function setControlsDisabled(disabled) {
  document.getElementById('sendBtn').disabled = disabled;
  document.getElementById('msgInput').disabled = disabled;
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
